<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Back photo frame — the "duplicate" copy, offset top-right, dimmed -->
  <rect x="12" y="3" width="17" height="17" rx="2.5" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.38"/>
  <!-- Front photo frame — the "original" copy -->
  <rect x="3" y="12" width="17" height="17" rx="2.5" fill="none" stroke="#fff" stroke-width="1.5"/>
  <!-- Sun inside front frame -->
  <circle cx="7.5" cy="16.5" r="1.7" fill="#fff"/>
  <!-- Mountain landscape inside front frame -->
  <path d="M3.5 27.5 L7.5 21 L11 24.5 L15 18 L20 27.5 Z" fill="#fff"/>
  <!-- Small loupe (magnifying glass) — scan indicator, bottom-right corner -->
  <circle cx="25.5" cy="25.5" r="4" fill="none" stroke="#fff" stroke-width="1.6" opacity="0.9"/>
  <line x1="28.3" y1="28.3" x2="30.5" y2="30.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
</svg>
